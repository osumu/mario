    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #111;
        }

        #loader {
            position: fixed;
            inset: 0;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5000;
        }

        .loader-box {
            text-align: center;
            color: white;
            font-family: sans-serif;
        }

        .loader-text {
            margin-bottom: 10px;
            opacity: 0.8;
        }

        .progress-bar {
            width: 250px;
            height: 6px;
            background: #333;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            width: 0%;
            background: #4fc3f7;
            transition: width 0.2s;
        }

        #runBtn {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 1000;
            padding: 10px 20px;
        }

        #speedSlider {
            position: fixed;
            top: 12px;
            left: 100px;
            z-index: 1000;
        }

        #speedLabel {
            position: fixed;
            top: 10px;
            left: 260px;
            color: white;
            z-index: 1000;
        }

        #editor {
            position: absolute;
            top: 50px;
            width: 100%;
            height: calc(100vh - 50px);
        }

        .piece {
            position: absolute;
            font-family: Consolas, monospace;
            font-size: 18px;
            white-space: pre;
            padding: 10px 14px;
            user-select: none;
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.8);

            cursor: -moz-grab;
            cursor: -webkit-grab;
            cursor: grab;
        }

        .piece.log {
            color: #4fc3f7;
        }

        .piece.info {
            color: #00ff88;
        }

        .piece.warn {
            color: #ffd54d;
        }

        .piece.error {
            color: #ff4d4d;
        }


        .particle {
            position: fixed;
            pointer-events: none;
            z-index: 2000;
            font-family: Consolas, monospace;
            font-size: 14px;
            color: white;
        }
    </style>
    <style>
        @keyframes wave {
            from {
                width: 10px;
                height: 10px;
                opacity: 1;
            }

            to {
                width: 150px;
                height: 150px;
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <div id="loader">
        <div class="loader-box">
            <div class="loader-text">Loading Python Compiler...</div>
            <div class="progress-bar">
                <div class="progress"></div>
            </div>
        </div>
    </div>

    <button id="runBtn">▶ Run</button>
    <input id="speedSlider" type="range" min="0.2" max="3" step="0.1" value="1">
    <span id="speedLabel">1.0x</span>

    <div id="editor"></div>
    <iframe id="pyFrame" src="python.html" style="display:none;"></iframe>

    <script>
        const loader = document.getElementById("loader");
        const progress = document.querySelector(".progress");

        let p = 0;
        const interval = setInterval(() => {
            p = Math.min(p + Math.random() * 10, 90);
            progress.style.width = p + "%";
        }, 200);

        window.addEventListener("message", (e) => {
            if (e.data.type === "py-ready") {
                progress.style.width = "100%";

                setTimeout(() => {
                    loader.style.opacity = "0";
                    loader.style.transition = "opacity 0.5s";
                    setTimeout(() => loader.remove(), 500);
                }, 300);

                clearInterval(interval);
            }
        });

        let editor;
        let engine, world;
        let bodies = [];

        const pyFrame = document.getElementById("pyFrame").contentWindow;

        function randomChar() {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
            return chars[Math.floor(Math.random() * chars.length)];
        }

        function createExplosion(x, y) {
            const wave = document.createElement("div");
            wave.style.position = "fixed";
            wave.style.left = x + "px";
            wave.style.top = y + "px";
            wave.style.width = "10px";
            wave.style.height = "10px";
            wave.style.borderRadius = "50%";
            wave.style.border = "2px solid rgba(255,255,255,0.8)";
            wave.style.transform = "translate(-50%, -50%)";
            wave.style.animation = "wave 0.5s ease-out forwards";
            document.body.appendChild(wave);

            setTimeout(() => wave.remove(), 500);

            for (let i = 0; i < 18; i++) {
                const p = document.createElement("div");
                p.className = "particle";
                p.textContent = randomChar();

                p.style.left = x + "px";
                p.style.top = y + "px";

                document.body.appendChild(p);

                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * 6 + 2;
                let vx = Math.cos(angle) * speed;
                let vy = Math.sin(angle) * speed;

                let life = 0;

                function animate() {
                    life++;

                    vx *= 0.96;
                    vy *= 0.96;

                    const rect = p.getBoundingClientRect();
                    p.style.left = rect.left + vx + "px";
                    p.style.top = rect.top + vy + "px";

                    p.style.opacity = 1 - life / 40;

                    if (life < 40) requestAnimationFrame(animate);
                    else p.remove();
                }

                animate();
            }
        }

        // ---------------- Monaco ----------------
        require.config({ paths: { vs: 'https://unpkg.com/monaco-editor@0.45.0/min/vs' } });

        require(["vs/editor/editor.main"], function () {
            editor = monaco.editor.create(document.getElementById("editor"), {
                value: `print("Hello")
print(1+2)
`,
                language: "python",
                theme: "vs-dark"
            });
        });

        // ---------------- Physics ----------------
        function initPhysics() {
            engine = Matter.Engine.create();
            world = engine.world;

            const w = window.innerWidth;
            const h = window.innerHeight;

            const thickness = 100;
            const margin = 50;

            const ground = Matter.Bodies.rectangle(w / 2, h - margin, w, thickness, { isStatic: true, label: "wall" });
            const ceiling = Matter.Bodies.rectangle(w / 2, margin, w, thickness, { isStatic: true, label: "wall" });
            const left = Matter.Bodies.rectangle(margin, h / 2, thickness, h, { isStatic: true, label: "wall" });
            const right = Matter.Bodies.rectangle(w - margin, h / 2, thickness, h, { isStatic: true, label: "wall" });

            Matter.World.add(world, [ground, ceiling, left, right]);

            Matter.Runner.run(Matter.Runner.create(), engine);

            // 衝突 → 爆発
            Matter.Events.on(engine, "collisionStart", (event) => {
                event.pairs.forEach(pair => {
                    [pair.bodyA, pair.bodyB].forEach(body => {
                        const obj = bodies.find(o => o.body === body);
                        if (!obj) return;

                        const vx = body.velocity.x;
                        const vy = body.velocity.y;
                        const speed = Math.sqrt(vx * vx + vy * vy);

                        if (speed > 15) {
                            const pos = body.position;

                            createExplosion(pos.x, pos.y);

                            Matter.World.remove(world, body);
                            obj.el.remove();

                            bodies = bodies.filter(o => o !== obj);
                        }
                    });
                });
            });

            (function update() {
                bodies.forEach(obj => {
                    const pos = obj.body.position;
                    const angle = obj.body.angle;

                    obj.el.style.transform =
                        `translate(${pos.x}px,${pos.y}px) rotate(${angle}rad)`;
                });

                requestAnimationFrame(update);
            })();
        }

        function createPiece(text, type = "log") {
            const el = document.createElement("div");
            el.className = "piece " + type;
            el.textContent = text;
            document.body.appendChild(el);

            const rect = el.getBoundingClientRect();

            const x = window.innerWidth / 2 + (Math.random() - 0.5) * 200;
            const y = 100;

            const body = Matter.Bodies.rectangle(x, y, rect.width, rect.height, {
                restitution: 0.5
            });

            Matter.World.add(world, body);
            bodies.push({ body, el });

            // ---------------- ドラッグ＆投げ ----------------
            let dragging = false;
            let offsetX = 0;
            let offsetY = 0;

            let lastMouse = null;
            let lastTime = null;

            el.addEventListener("mousedown", (e) => {
                dragging = true;

                const rect = el.getBoundingClientRect();
                offsetX = e.clientX - rect.left;
                offsetY = e.clientY - rect.top;

                lastMouse = { x: e.clientX, y: e.clientY };
                lastTime = performance.now();

                Matter.Body.setVelocity(body, { x: 0, y: 0 });
            });

            window.addEventListener("mousemove", (e) => {
                if (!dragging) return;

                const now = performance.now();
                const dt = now - lastTime || 1;

                const dx = e.clientX - lastMouse.x;
                const dy = e.clientY - lastMouse.y;

                // 位置を追従
                Matter.Body.setPosition(body, {
                    x: e.clientX - offsetX,
                    y: e.clientY - offsetY
                });

                // 投げ用速度を更新
                const vx = dx / dt * 16;
                const vy = dy / dt * 16;

                body.velocity.x = vx;
                body.velocity.y = vy;

                lastMouse = { x: e.clientX, y: e.clientY };
                lastTime = now;
            });

            window.addEventListener("mouseup", () => {
                if (!dragging) return;
                dragging = false;
            });
        }

        window.addEventListener("message", (e) => {
            const data = e.data;

            if (data.type === "log") {
                createPiece(data.msg, data.level || "log");
            }

            if (data.type === "input") {
                const result = prompt(data.msg || "input:");
                pyFrame.postMessage({
                    type: "inputResult",
                    value: result
                }, "*");
            }
        });

        // ---------------- Run ----------------
        document.getElementById("runBtn").onclick = () => {
            bodies.forEach(b => Matter.World.remove(world, b.body));
            bodies = [];

            pyFrame.postMessage({
                type: "run",
                code: editor.getValue()
            }, "*");
        };

        // ---------------- Speed ----------------
        const slider = document.getElementById("speedSlider");
        const label = document.getElementById("speedLabel");

        slider.addEventListener("input", (e) => {
            const v = parseFloat(e.target.value);
            label.textContent = v.toFixed(1) + "x";
            if (engine) engine.timing.timeScale = v;
        });

        // ---------------- init ----------------
        initPhysics();
    </script>

</body>

</html>
